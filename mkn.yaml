#! clean build test -gdtKOp test,test_lazy,gbench -l -pthread dbg
# -O >= 3 required for AVX

name: mkn.avx
property:
  # dependency versions: master on master, latest on latest (a bare dep is the default branch)
  cpp.iwyu.version: master
  mkn.kul.version: master
parent: headers

profile:
- name: headers
  inc: inc
  dep: mkn.kul#${mkn.kul.version}

- name: test_all
  parent: headers
  test: test/test_(\w*).cpp

- name: test
  parent: headers
  main: test/test_avx.cpp
  mode: none

- name: test_lazy
  parent: headers
  main: test/test_lazy.cpp
  mode: none

- name: test_aligned
  parent: headers
  main: test/test_aligned.cpp
  mode: none

- name: test_unaligned
  parent: headers
  main: test/test_unaligned.cpp
  mode: none

- name: b0
  parent: headers
  main: test/betterbench.cpp
  mode: none

- name: b1
  parent: headers
  main: test/betterbench.cpp
  arg: -DMKN_AVX_BENCH_AVX_N
  mode: none

- name: gbench
  parent: headers
  dep: google.benchmark
  main: test/bench.cpp
  mode: none

- name: format
  mod: |
    clang.format#master{init{style: file, types: hpp cpp ipp, paths: .}}

# include-what-you-use report for inc/, needs iwyu on PATH, see res/iwyu.imp
- name: iwyu
  parent: test
  mod:
  - name: cpp.iwyu
    version: ${cpp.iwyu.version}
    compile:
      paths: inc
      headers: -x c++-header
      args: -Xiwyu --mapping_file=res/iwyu.imp

- name: xsimd
  parent: headers
  inc: tpp/xsimd/include
  main: test/compare_xsimd.cpp
  sub: xsimd&tpp/xsimd(https://github.com/xtensor-stack/xsimd)

- name: compare_mkn_avx
  parent: headers
  main: test/compare_mkn_avx.cpp
  mode: none
